[project]
name = "chatbot-platform-backend"
version = "0.1.0"
description = "Multi-tenant chatbot backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "litellm>=1.51.0",
    "cryptography>=43.0.0",
    "numpy>=2.0.0",
    "httpx>=0.27.0",
    "pypdf>=5.0.0",
    "beautifulsoup4>=4.12.0",
    "tiktoken>=0.8.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic[email]>=2.9.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9.9", "pgvector>=0.3.0"]
