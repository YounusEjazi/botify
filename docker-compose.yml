services:
  backend:
    build:
      context: ./backend
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /app
        COPY pyproject.toml .
        RUN pip install --no-cache-dir -e ".[postgres]"
        COPY . .
        CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    environment:
      - DATABASE_URL=postgresql+psycopg2://chatbot:chatbot@db:5432/chatbot
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-change-me}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEFAULT_LLM_MODEL=${DEFAULT_LLM_MODEL:-gpt-4o-mini}
      - DEFAULT_EMBEDDING_MODEL=${DEFAULT_EMBEDDING_MODEL:-text-embedding-3-small}
    depends_on: [db]
    volumes: ["./backend:/app"]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot
      POSTGRES_DB: chatbot
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  dashboard:
    build:
      context: ./dashboard
      dockerfile_inline: |
        FROM node:20-alpine
        WORKDIR /app
        COPY package.json ./
        RUN npm install
        COPY . .
        CMD ["npm", "run", "dev"]
    ports: ["3000:3000"]
    environment:
      - BACKEND_URL=http://backend:8000
      - ADMIN_API_KEY=${ADMIN_API_KEY:-change-me}
      - AUTH_SECRET=${AUTH_SECRET:-change-me-to-a-random-32-char-secret}
    depends_on: [backend]
    volumes: ["./dashboard:/app", "/app/node_modules", "/app/.next"]

volumes:
  pgdata: