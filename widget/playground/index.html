<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Widget Playground</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(180deg, #fafafa 0%, #f0f0f4 100%);
            min-height: 100vh;
            padding: 40px;
            color: #1a1a1a;
        }
        .wrap { max-width: 720px; margin: 0 auto; }
        h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: -0.02em; }
        p  { color: #555; max-width: 56ch; }
        code { background: rgba(0,0,0,0.05); padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
        pre {
            background: #1a1a1a; color: #f0f0f0;
            padding: 16px 18px; border-radius: 8px;
            overflow-x: auto; font-size: 13px; line-height: 1.55;
        }
        .row { display: flex; gap: 8px; margin: 12px 0; }
        button {
            padding: 8px 14px; border-radius: 6px; border: 1px solid #ccc;
            background: white; cursor: pointer; font: inherit;
        }
        button.active { background: #1a1a1a; color: white; border-color: #1a1a1a; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>Widget playground</h1>
    <p>
        Hot-reloads from <code>src/main.ce.js</code>. Switch tenants below
        to test against different seed rows.
    </p>

    <div class="row">
        <button id="b-demo" class="active">demo</button>
        <button id="b-custom">custom…</button>
    </div>

    <div id="custom-row" class="row" style="display: none; align-items: center;">
        <label for="custom-slug" style="font-size: 13px; color: #555;">Tenant slug:</label>
        <input id="custom-slug" type="text" placeholder="acme"
               autocomplete="off"
               style="flex: 1; padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; font: inherit;">
    </div>

    <h3>Embed snippet</h3>
    <pre id="snippet"></pre>

    <p>
        The widget mounts itself automatically. Look bottom-right of the page.
    </p>
</div>

<!-- Dev: bring in the widget source directly. In production this becomes:
     <script src="https://cdn.yours.com/widget.v1.js" data-tenant="…" async></script>
-->
<script id="widget-script" type="module"
        src="/src/main.ce.js"
        data-tenant="demo"
        data-api-base="http://localhost:8000"
        data-position="bottom-right"></script>

<script>
    const snippetEl = document.getElementById("snippet")

    // The widget script in the <head> registers the <chatbot-widget> custom
    // element on first load. Re-injecting an ES module doesn't re-execute it,
    // so we mount/remount the element directly instead.
    function setTenant(slug) {
        document.querySelectorAll("chatbot-widget").forEach(n => n.remove())

        const el = document.createElement("chatbot-widget")
        el.setAttribute("tenant", slug)
        el.setAttribute("api-base", "http://localhost:8000")
        el.setAttribute("position", "bottom-right")
        el.setAttribute("mode", "popup")
        document.body.appendChild(el)

        snippetEl.textContent =
            '<script\n  src="https://cdn.yours.com/widget.v1.js"\n' +
            `  data-tenant="${slug}"\n` +
            '  data-api-base="https://api.yours.com"\n' +
            '  data-position="bottom-right"\n' +
            '  async><\/script>'
        document.querySelectorAll(".row button").forEach(b =>
            b.classList.toggle("active", b.id === `b-${slug}`)
        )
    }
    const customRow = document.getElementById("custom-row")
    const customInput = document.getElementById("custom-slug")

    document.getElementById("b-demo").onclick = () => {
        customRow.style.display = "none"
        setTenant("demo")
    }
    document.getElementById("b-custom").onclick = () => {
        customRow.style.display = "flex"
        customInput.focus()
        if (customInput.value.trim()) setTenant(customInput.value.trim())
    }

    // Live remount as the user types. Mark the "custom" button active while editing.
    let debounce
    customInput.addEventListener("input", () => {
        clearTimeout(debounce)
        const slug = customInput.value.trim()
        if (!slug) return
        debounce = setTimeout(() => {
            setTenant(slug)
            // setTenant toggles active by id; force "custom" lit for arbitrary slugs.
            document.querySelectorAll(".row button").forEach(b => b.classList.remove("active"))
            document.getElementById("b-custom").classList.add("active")
        }, 250)
    })

    setTenant("demo")
</script>
</body>
</html>
